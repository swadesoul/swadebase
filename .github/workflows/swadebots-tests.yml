name: SWADEBOTS tests

on:
  pull_request:
    paths:
      - 'swadebots/**'
      - 'docs/SWADE_ONTOLOGY_PRIMER.md'
      - 'docs/SWADEBOTS_CONSOLE.md'
      - '.github/workflows/swadebots-tests.yml'
  push:
    branches: [master]
    paths:
      - 'swadebots/**'
      - 'docs/SWADE_ONTOLOGY_PRIMER.md'
      - 'docs/SWADEBOTS_CONSOLE.md'
      - '.github/workflows/swadebots-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run SWADEBOTS tests
        working-directory: swadebots
        run: node --test --test-concurrency=1 test/*.test.mjs

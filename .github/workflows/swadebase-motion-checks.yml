name: SwadeBase Motion Studio checks

# Light, free checks on GitHub-hosted runners for the SWADEBASE-owned Motion Studio code.
on:
  pull_request:
    paths:
      - 'motion/**'
      - 'docker/volumes/functions/motion-studio/**'
      - 'supabase/migrations/*motion*'
      - '.github/workflows/swadebase-motion-checks.yml'
  push:
    branches: [master]
    paths:
      - 'motion/**'
      - 'docker/volumes/functions/motion-studio/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Motion Studio present
        id: present
        run: |
          if [ -f motion/styles/build.mjs ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "Motion Studio not on this branch yet; nothing to check."; fi
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Library builds (86 styles, 14 categories, valid palettes)
        if: steps.present.outputs.yes == 'true'
        run: node motion/styles/build.mjs
      - name: Generated copies are up to date
        if: steps.present.outputs.yes == 'true'
        run: |
          if ! git diff --exit-code -- motion docker/volumes/functions/motion-studio supabase/migrations; then
            echo "::error::Run 'node motion/styles/build.mjs' and commit the regenerated files."
            exit 1
          fi
      - name: Worker, agent and adapter parse
        if: steps.present.outputs.yes == 'true'
        run: |
          node --check motion/worker/worker.mjs
          node --check motion/worker/template.mjs
          node --check motion/agent/motion-agent.mjs
          node --check motion/adapter/adapter.mjs
      - name: Recommender and brief compiler smoke test
        if: steps.present.outputs.yes == 'true'
        run: |
          node --input-type=module -e "
          import { recommendStyles, compileBrief } from './motion/adapter/adapter.mjs'
          import { readFileSync } from 'node:fs'
          const lib = JSON.parse(readFileSync('motion/styles/library.json', 'utf8')).styles
          const picks = recommendStyles(lib, { idea: 'explain how our AI agents automate workflow' }, 3)
          if (picks[0].id !== 'tech-glow') throw new Error('unexpected top pick ' + picks[0].id)
          const noAudio = compileBrief(lib[0], { mode: 'idea', idea: 'x' }, { files: {} })
          if (!noAudio.system.includes('There is NO audio file')) throw new Error('idea brief must forbid audio')
          console.log('ok', picks.map((p) => p.id).join(', '))
          "

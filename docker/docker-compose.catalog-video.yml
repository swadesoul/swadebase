# Opt-in catalog video worker. It is not part of the default SWADEBASE compose file.
# Do not point CATALOG_VIDEO_S3_* at production Backblaze until a separate approval.
# Concurrency is also capped at 1 inside claim_catalog_video_job.
services:
  catalog-video-worker:
    build:
      context: ..
      dockerfile: catalog-video/worker/Dockerfile
    restart: "no"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CATALOG_VIDEO_SIGNING_KEY: ${CATALOG_VIDEO_SIGNING_KEY}
      CATALOG_VIDEO_S3_ENDPOINT: ${CATALOG_VIDEO_S3_ENDPOINT:-}
      CATALOG_VIDEO_S3_BUCKET: ${CATALOG_VIDEO_S3_BUCKET:-}
      CATALOG_VIDEO_S3_REGION: ${CATALOG_VIDEO_S3_REGION:-us-east-1}
      CATALOG_VIDEO_S3_ACCESS_KEY_ID: ${CATALOG_VIDEO_S3_ACCESS_KEY_ID:-}
      CATALOG_VIDEO_S3_SECRET_ACCESS_KEY: ${CATALOG_VIDEO_S3_SECRET_ACCESS_KEY:-}
      CATALOG_VIDEO_WORKER_ID: catalog-video-worker
      CATALOG_VIDEO_POLL_MS: ${CATALOG_VIDEO_POLL_MS:-4000}
      CATALOG_VIDEO_X264_PRESET: ${CATALOG_VIDEO_X264_PRESET:-veryfast}
      CATALOG_VIDEO_X264_CRF: ${CATALOG_VIDEO_X264_CRF:-20}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536M
    depends_on:
      kong:
        condition: service_healthy
